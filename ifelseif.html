<html>\
    <body>
        <h1>if else if in js</h1>
        <p id="result"></p>
        <script>
            let marks=75;
            let grade;
        if(marks>=90)
        {
            grade="A+";
        }
        else if(marks>=80)
        {
            grade="A";
        }
        else if(marks>=70)
        {
            grade="B+";
        }
        else if(marks>=60)
        {
            grade="c"
        }
        else{
            grade="fail"
        }
        document.write("marks="+marks+"<br>"+"grade="+grade);
        
        </script>
    </body>
</html>
