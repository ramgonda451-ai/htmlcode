<html>
    <body>
        <p id="choice"></p>
        <script>
            let day=3;
            switch(day){
                case 1:
                    document.getElementById("choice").innerHTML="monday";
                    break;
                case 2:
                    document.getElementById("choice").innerHTML="tuesday";
                    break;
                case 3:
                    document.getElementById("choice").innerHTML="wednesday";
                    break;
                case 4:
                    document.getElementById("choice").innerHTML="thursday";
                    break;
                case 5:
                    document.getElementById("choice").innerHTML="friday";
                    break;
                case 6:
                    document.getElementById("choice").innerHTML="saturday";
                    break;
                case 7:
                    document.getElementById("choice").innerHTML="sunday";
                    break;
                default:
                    document.getElementById("choice").innerHTML="invalid day";
            }
        </script>
    </body>
</html>
